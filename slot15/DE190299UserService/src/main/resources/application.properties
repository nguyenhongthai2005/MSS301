spring.application.name=DE190299UserService
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE_MEDIA;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration (MANDATORY: ddl-auto=none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
