spring.application.name=DE190299MediaGateway
server.port=8080

# -- Routes --
# User Service API
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# User Service OpenAPI docs
spring.cloud.gateway.server.webflux.routes[1].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

# Post Service API
spring.cloud.gateway.server.webflux.routes[2].id=post-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/posts/**

# Post Service OpenAPI docs
spring.cloud.gateway.server.webflux.routes[3].id=post-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/post-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

# -- Swagger / SpringDoc --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Aggregate downstream service docs in gateway Swagger UI (same-origin via gateway)
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=/post-service/v3/api-docs
