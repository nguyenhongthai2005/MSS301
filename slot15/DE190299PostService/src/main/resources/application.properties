spring.application.name=DE190299PostService
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE_MEDIA;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration (MANDATORY: ddl-auto=none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Feign Configuration
user.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.user-service.connect-timeout=3000
spring.cloud.openfeign.client.config.user-service.read-timeout=5000
spring.cloud.openfeign.client.config.user-service.logger-level=basic

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
