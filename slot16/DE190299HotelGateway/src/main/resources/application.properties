spring.application.name=DE190299HotelGateway
server.port=8080

# -- Routes --
# Room Service API
spring.cloud.gateway.server.webflux.routes[0].id=room-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms/**

# Room Service OpenAPI docs
spring.cloud.gateway.server.webflux.routes[1].id=room-service-docs
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/room-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

# Reservation Service API
spring.cloud.gateway.server.webflux.routes[2].id=reservation-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/reservations/**

# Reservation Service OpenAPI docs
spring.cloud.gateway.server.webflux.routes[3].id=reservation-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/reservation-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

# -- Swagger / SpringDoc --
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Aggregate downstream service docs in gateway Swagger UI (same-origin via gateway)
springdoc.swagger-ui.urls[0].name=room-service
springdoc.swagger-ui.urls[0].url=/room-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=reservation-service
springdoc.swagger-ui.urls[1].url=/reservation-service/v3/api-docs
