# [TODO-2.2: datasource DBWatch + naming strategy]
server:
  port: 8083

spring:
  application:
    name: ms-watch
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBWatch;encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:sa}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        # Giữ NGUYÊN tên trong @Table/@Column (Watches, WatchCategories...) đúng như đề bài.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false

logging:
  level:
    com.mss301.watch: INFO
